<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Vouch · Weekly events</title>
<style>
  :root { --ink:#0C0D0E; --muted:#6B7280; --line:#E5E7EB; --green:#052F17; --leaf:#2F6B4F; --fair:#F3F8F2; --claret:#7A1F2B; --bg:#FBFBF9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:18px 24px; border-bottom:1px solid var(--line); background:#fff; position:sticky; top:0; z-index:2; }
  header h1 { font-size:18px; margin:0; font-weight:600; letter-spacing:.2px; }
  header .sp { flex:1; }
  header button { background:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px; color:var(--muted); cursor:pointer; }
  main { max-width:1040px; margin:0 auto; padding:22px 24px 80px; }
  .cities { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 14px; cursor:pointer; font-weight:500; }
  .chip.on { background:var(--green); color:#fff; border-color:var(--green); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media (max-width:820px) { .grid { grid-template-columns:1fr; } }
  .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 20px; }
  .card h2 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .card .sub { color:var(--muted); font-size:13px; margin-bottom:12px; }
  .drop { border:2px dashed #C9D6CD; border-radius:14px; padding:34px 18px; text-align:center; color:var(--muted); background:var(--fair); cursor:pointer; transition:background .15s; }
  .drop.over { background:#E4F0E7; border-color:var(--leaf); color:var(--green); }
  .drop strong { color:var(--green); }
  .drop input { display:none; }
  .file { margin-top:14px; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
  .file h3 { margin:0; font-size:14px; font-weight:600; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .tag { font-size:11px; letter-spacing:.8px; text-transform:uppercase; border-radius:999px; padding:3px 8px; background:var(--fair); color:var(--green); font-weight:600; }
  .tag.hh { background:#FBEFF0; color:var(--claret); }
  .nums { display:flex; gap:18px; flex-wrap:wrap; margin:10px 0 6px; }
  .num b { display:block; font-size:22px; font-weight:600; line-height:1.1; }
  .num span { font-size:12px; color:var(--muted); }
  .bars { margin:8px 0 0; padding:0; list-style:none; }
  .bars li { display:grid; grid-template-columns:130px 1fr 34px; align-items:center; gap:8px; font-size:13px; padding:2px 0; }
  .bars li i { display:block; height:8px; border-radius:4px; background:var(--leaf); }
  .bars li em { font-style:normal; color:var(--muted); text-align:right; }
  details { margin-top:8px; }
  summary { cursor:pointer; color:var(--muted); font-size:13px; }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
  td, th { text-align:left; padding:5px 6px; border-top:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  .warn { color:var(--claret); }
  .ok { color:var(--leaf); }
  .actions { display:flex; gap:10px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button.primary { background:var(--green); color:#fff; border:0; border-radius:999px; padding:10px 18px; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  button.ghost { background:none; border:1px solid var(--line); border-radius:999px; padding:9px 14px; cursor:pointer; }
  .msg { font-size:13px; color:var(--muted); }
  .msg.err { color:var(--claret); }
  .top { margin:6px 0 0; padding:0; list-style:none; }
  .top li { display:flex; gap:8px; padding:5px 0; border-top:1px solid var(--line); font-size:13px; }
  .top li b { min-width:26px; color:var(--green); }
  .top li span { color:var(--muted); }
  .gate { max-width:380px; margin:14vh auto 0; }
  .gate input { width:100%; font-size:16px; padding:12px 14px; border:1px solid var(--line); border-radius:12px; margin:10px 0; }
  .weeks { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:560px) { .weeks { grid-template-columns:1fr; } }
  .wk h4 { margin:8px 0 2px; font-size:13px; color:var(--muted); font-weight:500; }
  .empty { color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Vouch · Weekly events</h1>
  <span class="sp"></span>
  <span id="who" class="msg"></span>
  <button id="out" hidden>Sign out</button>
</header>
<main id="app"></main>

<script>
/* The page is static (GitHub Pages). Everything that needs a key — reading the queue, Google,
   writing to the app — runs in the `curated-dashboard` edge function, which checks the team
   password on every call. Nothing here can reach the database on its own. */
const FN = "https://mtqdvyvjyudornwxvuhl.supabase.co/functions/v1/curated-dashboard";
const CITIES = [["nyc","New York"],["sf","San Francisco"],["la","Los Angeles"],["boston","Boston"],["seattle","Seattle"],["cdmx","Mexico City"]];
const CAT = { music_nightlife:"Music & nightlife", art_exhibition:"Art & exhibitions", food_drink:"Food & drink", popup_retail:"Pop-ups & retail",
              film_theater:"Film & theater", talks_community:"Talks & community", outdoor_neighborhood:"Outdoor & neighborhood", wellness_fitness:"Wellness & fitness", sports:"Sports" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
const S = { pw: sessionStorage.getItem("vouch.dash.pw") || "", city: localStorage.getItem("vouch.dash.city") || "nyc", files: [], stats: null, statsErr: null, loading: false };

async function call(body){
  const r = await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ password:S.pw, city:S.city, ...body }) });
  const j = await r.json().catch(() => ({ error:`HTTP ${r.status}` }));
  if (r.status === 401) { S.pw = ""; sessionStorage.removeItem("vouch.dash.pw"); render(); throw new Error("Wrong password"); }
  if (!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}

/* ------------------------------------------------------------- password */
function gate(msg){
  $("#out").hidden = true; $("#who").textContent = "";
  $("#app").innerHTML = `<div class="gate card">
    <h2>Team password</h2>
    <div class="sub">One password for the team. It is checked by the server on every upload.</div>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    ${msg ? `<div class="msg err">${esc(msg)}</div>` : ""}
    <div class="actions"><button class="primary" id="go">Enter</button></div>
  </div>`;
  const go = async () => {
    S.pw = $("#pw").value.trim();
    if (!S.pw) return;
    $("#go").disabled = true;
    try { await call({ action:"stats" }); sessionStorage.setItem("vouch.dash.pw", S.pw); render(); await loadStats(); }
    catch (e) { S.pw = ""; gate(e.message === "Wrong password" ? "That’s not it. Try again." : `Couldn’t reach the server: ${e.message}`); }
  };
  $("#go").onclick = go;
  $("#pw").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

/* ------------------------------------------------------------- main page */
function render(){
  if (!S.pw) return gate();
  $("#out").hidden = false; $("#who").textContent = "signed in";
  $("#out").onclick = () => { S.pw = ""; sessionStorage.removeItem("vouch.dash.pw"); S.files = []; S.stats = null; render(); };
  const cityName = Object.fromEntries(CITIES)[S.city];
  $("#app").innerHTML = `
    <div class="cities">${CITIES.map(([k,n]) => `<button class="chip ${k===S.city?"on":""}" data-city="${k}">${n}</button>`).join("")}</div>
    <div class="grid">
      <section class="card">
        <h2>Drop this week’s sheets · ${esc(cityName)}</h2>
        <div class="sub">The events CSV and the happy-hours CSV, one or both at once. Each is read and previewed first; nothing reaches the app until you press Publish.</div>
        <label class="drop" id="drop"><input type="file" id="pick" accept=".csv,text/csv" multiple>
          <strong>Drop CSV files here</strong> or click to choose<br><span style="font-size:12px">events: event_name, date_range, … · happy hours: business_name, hours_days, …</span></label>
        <div id="files"></div>
      </section>
      <section class="card" id="statsCard">
        <h2>In the app · ${esc(cityName)}</h2>
        <div class="sub">What’s live this week and next, and what people do with it. <a href="#" id="refresh">Refresh</a></div>
        <div id="stats"><span class="empty">Loading…</span></div>
      </section>
    </div>`;
  document.querySelectorAll("[data-city]").forEach(b => b.onclick = () => { S.city = b.dataset.city; localStorage.setItem("vouch.dash.city", S.city); S.files = []; S.stats = null; render(); loadStats(); });
  $("#refresh").onclick = e => { e.preventDefault(); loadStats(); };
  const drop = $("#drop");
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); };
  $("#pick").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
  renderFiles(); renderStats();
}

/* ------------------------------------------------------------- uploads */
function kindOf(text){
  const head = text.replace(/^﻿/, "").split(/\r?\n/)[0].toLowerCase();
  if (head.includes("business_name") && head.includes("hours_days")) return "happy_hours";
  if (head.includes("event_name")) return "events";
  return null;
}
async function addFiles(list){
  for (const f of Array.from(list)) {
    const text = await f.text();
    const kind = kindOf(text);
    const entry = { id: Math.random().toString(36).slice(2), name: f.name, text, kind, state: kind ? "previewing" : "bad", preview: null, result: null, error: kind ? null : "Not an events or happy-hours sheet: the first line has neither event_name nor business_name/hours_days." };
    S.files.unshift(entry);
    renderFiles();
    if (!kind) continue;
    try { entry.preview = await call({ action:kind, csv:text, fileName:f.name, dryRun:true }); entry.state = "ready"; }
    catch (e) { entry.error = e.message; entry.state = "bad"; }
    renderFiles();
  }
}
async function publish(id){
  const f = S.files.find(x => x.id === id);
  if (!f || f.state !== "ready") return;
  f.state = "publishing"; renderFiles();
  try { f.result = await call({ action:f.kind, csv:f.text, fileName:f.name, dryRun:false }); f.state = "done"; }
  catch (e) { f.error = e.message; f.state = "ready"; }
  renderFiles(); loadStats();
}
function bars(list, label = x => x){
  if (!list || !list.length) return `<div class="empty">—</div>`;
  const max = Math.max(...list.map(x => x.count));
  return `<ul class="bars">${list.map(x => `<li><span>${esc(label(x.name))}</span><i style="width:${Math.max(4, 100 * x.count / max)}%"></i><em>${x.count}</em></li>`).join("")}</ul>`;
}
function renderFiles(){
  const box = $("#files"); if (!box) return;
  box.innerHTML = S.files.map(f => {
    const p = f.preview, r = f.result;
    const tag = f.kind === "happy_hours" ? `<span class="tag hh">Happy hours</span>` : f.kind === "events" ? `<span class="tag">Events</span>` : `<span class="tag">?</span>`;
    let body = "";
    if (f.state === "previewing") body = `<div class="msg">Reading the sheet and checking it against the app…</div>`;
    else if (f.state === "bad") body = `<div class="msg err">${esc(f.error)}</div>`;
    else if (f.kind === "events" && p) {
      body = `
        <div class="nums">
          <div class="num"><b>${p.rowsRead}</b><span>rows in sheet</span></div>
          <div class="num"><b>${p.publishable - p.skipped.length}</b><span>${f.state==="done" ? "published" : "to publish"}</span></div>
          <div class="num"><b>${p.notPublishable}</b><span>over or unreadable</span></div>
          <div class="num"><b>${p.skipped.length}</b><span>already in app</span></div>
          <div class="num"><b>${p.rejected.length}</b><span>old rows to retire</span></div>
        </div>
        <div class="weeks">
          <div><h4>By category</h4>${bars(p.bySheetCategory)}</div>
          <div><h4>By kind</h4>${bars(p.byEventType)}<h4>Week</h4>${bars(p.byWeek)}</div>
        </div>
        <details><summary>${p.rows.length} events in this sheet</summary>
          <table><tr><th>Event</th><th>Date</th><th>Category</th><th>Venue</th></tr>
          ${p.rows.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.day)}${x.lastDay && x.lastDay!==x.day ? ` → ${esc(x.lastDay)}` : ""}</td><td>${esc(x.category)}</td><td>${esc(x.venue || "")}</td></tr>`).join("")}</table>
        </details>
        ${p.skipped.length ? `<details><summary>${p.skipped.length} skipped (already in the app)</summary><table>${p.skipped.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.why)}</td></tr>`).join("")}</table></details>` : ""}
        ${p.rejected.length ? `<details><summary>${p.rejected.length} earlier sheet rows not in this sheet → retired on publish</summary><table>${p.rejected.map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.week)}</td></tr>`).join("")}</table></details>` : ""}`;
    } else if (f.kind === "happy_hours" && p) {
      body = `
        <div class="nums">
          <div class="num"><b>${p.rowsRead}</b><span>bars in sheet</span></div>
          <div class="num"><b>${p.bars}</b><span>found on Google</span></div>
          <div class="num"><b>${p.windows}</b><span>${f.state==="done" ? "happy hours published" : "happy hours to publish"}</span></div>
          <div class="num"><b>${p.skipped.length}</b><span>skipped</span></div>
        </div>
        <h4 style="margin:6px 0 2px;font-size:13px;color:var(--muted);font-weight:500">Days</h4>${bars(p.byDays)}
        <details><summary>${p.rows.length} bars</summary><table><tr><th>Bar</th><th>Hours</th><th>Deal</th></tr>
          ${p.rows.map(x => `<tr><td>${esc(x.googleName)}</td><td>${x.windows.map(esc).join("<br>")}</td><td>${esc(x.deal || "")}</td></tr>`).join("")}</table></details>
        ${p.skipped.length ? `<details><summary class="warn">${p.skipped.length} skipped (no hours, or Google found a different place)</summary><table>${p.skipped.map(x => `<tr><td>${esc(x)}</td></tr>`).join("")}</table></details>` : ""}`;
    }
    const actions = f.state === "ready" ? `<div class="actions"><button class="primary" data-pub="${f.id}">Publish to the app</button>${f.error ? `<span class="msg err">${esc(f.error)}</span>` : `<span class="msg">Live for everyone on their next open.</span>`}</div>`
      : f.state === "publishing" ? `<div class="actions"><button class="primary" disabled>Publishing…</button><span class="msg">Looking up venues on Google and writing.</span></div>`
      : f.state === "done" ? `<div class="actions"><span class="msg ok">✓ Published ${r?.written ?? ""} ${f.kind === "events" ? "events" : "happy hours"}${r?.geocoded ? ` · ${r.geocoded} venues located` : ""}${r?.totalInApp != null ? ` · ${r.totalInApp} happy hours now live for this city` : ""}.</span></div>` : "";
    return `<div class="file"><h3>${tag} ${esc(f.name)}</h3>${body}${actions}</div>`;
  }).join("");
  document.querySelectorAll("[data-pub]").forEach(b => b.onclick = () => publish(b.dataset.pub));
}

/* ------------------------------------------------------------- stats */
async function loadStats(){
  if (!S.pw) return;
  S.stats = null; S.statsErr = null; renderStats();
  try { S.stats = await call({ action:"stats" }); } catch (e) { S.statsErr = e.message; }
  renderStats();
}
function topList(t, what){
  if (!t) return `<div class="empty">Not connected.</div>`;
  if (!t.top.length) return `<div class="empty">Nothing ${what} yet.</div>`;
  return `<ul class="top">${t.top.map(x => `<li><b>${x.count}</b><div>${esc(x.name)}<br><span>${esc(x.venue || "")}${x.type ? ` · ${esc(x.type)}` : ""}</span></div></li>`).join("")}</ul>`;
}
function renderStats(){
  const box = $("#stats"); if (!box) return;
  if (S.statsErr) { box.innerHTML = `<div class="msg err">${esc(S.statsErr)}</div>`; return; }
  const s = S.stats; if (!s) { box.innerHTML = `<span class="empty">Loading…</span>`; return; }
  const wk = w => `<div class="wk"><h4>${w.week === s.thisWeek ? "This week" : "Next week"} · ${esc(w.week)}</h4>
    <div class="nums"><div class="num"><b>${w.live}</b><span>events live</span></div><div class="num"><b>${w.fromSheet}</b><span>from sheets</span></div><div class="num"><b>${w.pipelineWaiting}</b><span>pipeline, unreviewed</span></div></div>
    ${bars(w.byCategory, n => CAT[n] || n)}</div>`;
  box.innerHTML = `
    <div class="weeks">${s.perWeek.map(wk).join("")}</div>
    <div class="nums" style="margin-top:14px"><div class="num"><b>${s.happyHours}</b><span>happy hours live</span></div><div class="num"><b>${s.saves.total}</b><span>event saves, 30 days</span></div><div class="num"><b>${s.rated.total}</b><span>events rated, 30 days</span></div>${s.opened ? `<div class="num"><b>${s.opened.total}</b><span>event pages opened, 14 days</span></div>` : ""}</div>
    <div class="weeks">
      <div><h4 style="font-size:13px;color:var(--muted);font-weight:500">Most saved</h4>${topList(s.saves, "saved")}</div>
      <div><h4 style="font-size:13px;color:var(--muted);font-weight:500">Most rated</h4>${topList(s.rated, "rated")}</div>
    </div>
    <div style="margin-top:12px"><h4 style="font-size:13px;color:var(--muted);font-weight:500">Most opened</h4>
      ${s.opened ? topList(s.opened, "opened") : `<div class="empty">Page opens live in PostHog. To show them here, add POSTHOG_PERSONAL_API_KEY and POSTHOG_PROJECT_ID to the edge function’s secrets.${s.opensError ? ` (${esc(s.opensError)})` : ""}</div>`}
    </div>
    <div class="msg" style="margin-top:10px">Updated ${new Date(s.generatedAt).toLocaleTimeString()}</div>`;
}

render();
if (S.pw) loadStats();
</script>
</body>
</html>
